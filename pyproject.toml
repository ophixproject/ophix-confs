[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-confs"
version = "2026.10.05.03"
description = "Configuration snippets domain plugin for Ophix Project Servers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
keywords = ["django", "ophix", "configuration", "fleet management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "ophix-server-base>=2026.06.08.01",
    "ophix-codemirror>=2026.06.05.01",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://ophix.io"
Documentation = "https://github.com/ophixproject/ophix-confs#readme"
Source = "https://github.com/ophixproject/ophix-confs"

[project.entry-points."ophix.plugins"]
ophix_confs = "ophix_confs"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ophix_confs = [
    "OPHIX_RELEASE_NOTES.md",
    "docs/**/*",
    "locale/**/*",
    "migrations/**/*",
    "deploy_templates/**/*",
]
